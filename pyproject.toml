[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "private-document-gateway"
version = "0.2.0"
description = "Self-hosted, secure document-to-Markdown gateway for LLM tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "MIT" }
authors = [{ name = "Private Document Gateway contributors" }]
dependencies = [
  "fastapi>=0.141,<0.142",
  "markitdown[docx,pdf,pptx,xlsx]>=0.1.7,<0.2",
  "mcp>=2.0,<3",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0.52,<2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
private-document-gateway = "app.main:run"
private-document-gateway-mcp = "app.mcp.server:run_stdio"
private-document-gateway-backup = "app.maintenance.backup:main"
private-document-gateway-reindex-cache = "app.maintenance.reindex:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
