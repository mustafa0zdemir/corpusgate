services:
  gateway:
    build:
      context: .
    image: private-document-gateway:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PDG_DATA_DIR: /data
      PDG_DATABASE_URL: sqlite:////data/database/gateway.db
      PDG_API_KEY: "${PDG_API_KEY:?Set PDG_API_KEY in .env}"
      PDG_ALLOWED_HOSTS: "${PDG_ALLOWED_HOSTS:-localhost,localhost:*,127.0.0.1,127.0.0.1:*}"
    ports:
      - "${PDG_PORT:-8000}:8000"
    volumes:
      - gateway_uploads:/data/uploads
      - gateway_markdown:/data/markdown
      - gateway_database:/data/database
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  gateway_uploads:
  gateway_markdown:
  gateway_database:
