name: corpusgate

services:
  gateway:
    build:
      context: .
      target: runtime
    image: corpusgate:${CORPUSGATE_IMAGE_TAG:-0.1.0}
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CORPUSGATE_HOST: 0.0.0.0
      CORPUSGATE_PORT: 8000
      CORPUSGATE_DATA_DIR: /data
      CORPUSGATE_DOCUMENTS_DIR: /data/documents
      CORPUSGATE_CACHE_DIR: /data/cache
      CORPUSGATE_BACKUP_DIR: /backups
      CORPUSGATE_DATABASE_URL: sqlite:////data/database/gateway.db
      CORPUSGATE_API_KEY: "${CORPUSGATE_API_KEY:?Set CORPUSGATE_API_KEY in .env}"
      CORPUSGATE_MCP_AUTH_TOKENS: ""
      CORPUSGATE_MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
      CORPUSGATE_ALLOWED_HOSTS: "${CORPUSGATE_ALLOWED_HOSTS:?Set exact private/public hosts in .env}"
      CORPUSGATE_PUBLIC_BASE_URL: "${CORPUSGATE_PUBLIC_BASE_URL:-}"
      CORPUSGATE_LOG_LEVEL: "${CORPUSGATE_LOG_LEVEL:-INFO}"
    secrets:
      - mcp_auth_token
    ports:
      - "127.0.0.1:${CORPUSGATE_BIND_PORT:-8000}:8000"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${CORPUSGATE_INBOX_HOST_PATH:-./documents}
        target: /inbox
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CORPUSGATE_DOCUMENTS_HOST_PATH:-./state/documents}
        target: /data/documents
        bind:
          create_host_path: false
      - type: bind
        source: ${CORPUSGATE_CACHE_HOST_PATH:-./state/cache}
        target: /data/cache
        bind:
          create_host_path: false
      - type: bind
        source: ${CORPUSGATE_DATABASE_HOST_PATH:-./state/database}
        target: /data/database
        bind:
          create_host_path: false
      - type: bind
        source: ${CORPUSGATE_BACKUP_HOST_PATH:-./backups}
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "${CORPUSGATE_CPU_LIMIT:-2.0}"
    mem_limit: "${CORPUSGATE_MEMORY_LIMIT:-2g}"
    logging:
      driver: json-file
      options:
        max-size: "${CORPUSGATE_LOG_MAX_SIZE:-10m}"
        max-file: "${CORPUSGATE_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - backend
      - edge

  caddy:
    image: caddy:2.11.4-alpine
    profiles:
      - public
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CADDY_EMAIL: "${CADDY_EMAIL:-}"
      CORPUSGATE_PUBLIC_DOMAIN: "${CORPUSGATE_PUBLIC_DOMAIN:-}"
      CORPUSGATE_PROXY_MAX_BODY_SIZE: "${CORPUSGATE_PROXY_MAX_BODY_SIZE:-27MB}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  caddy_data:
  caddy_config:

secrets:
  mcp_auth_token:
    file: ${CORPUSGATE_MCP_AUTH_TOKEN_HOST_FILE:-./secrets/mcp_auth_token}
