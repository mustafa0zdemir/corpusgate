name: private-document-gateway

services:
  gateway:
    build:
      context: .
      target: runtime
    image: private-document-gateway:${PDG_IMAGE_TAG:-0.3.0}
    init: true
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PDG_HOST: 0.0.0.0
      PDG_PORT: 8000
      PDG_DATA_DIR: /data
      PDG_DOCUMENTS_DIR: /data/documents
      PDG_CACHE_DIR: /data/cache
      PDG_BACKUP_DIR: /backups
      PDG_DATABASE_URL: sqlite:////data/database/gateway.db
      PDG_API_KEY: "${PDG_API_KEY:?Set PDG_API_KEY in .env}"
      PDG_MCP_AUTH_TOKENS: ""
      PDG_MCP_AUTH_TOKEN_FILE: /run/secrets/mcp_auth_token
      PDG_ALLOWED_HOSTS: "${PDG_ALLOWED_HOSTS:?Set exact private/public hosts in .env}"
      PDG_PUBLIC_BASE_URL: "${PDG_PUBLIC_BASE_URL:-}"
      PDG_LOG_LEVEL: "${PDG_LOG_LEVEL:-INFO}"
    secrets:
      - mcp_auth_token
    ports:
      - "127.0.0.1:${PDG_BIND_PORT:-8000}:8000"
    expose:
      - "8000"
    volumes:
      - type: bind
        source: ${PDG_DOCUMENTS_HOST_PATH:-./state/documents}
        target: /data/documents
        bind:
          create_host_path: false
      - type: bind
        source: ${PDG_CACHE_HOST_PATH:-./state/cache}
        target: /data/cache
        bind:
          create_host_path: false
      - type: bind
        source: ${PDG_DATABASE_HOST_PATH:-./state/database}
        target: /data/database
        bind:
          create_host_path: false
      - type: bind
        source: ${PDG_BACKUP_HOST_PATH:-./backups}
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777,uid=10001,gid=10001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "${PDG_CPU_LIMIT:-2.0}"
    mem_limit: "${PDG_MEMORY_LIMIT:-2g}"
    logging:
      driver: json-file
      options:
        max-size: "${PDG_LOG_MAX_SIZE:-10m}"
        max-file: "${PDG_LOG_MAX_FILES:-5}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - backend

  caddy:
    image: caddy:2.11.4-alpine
    profiles:
      - public
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      CADDY_EMAIL: "${CADDY_EMAIL:-}"
      PDG_PUBLIC_DOMAIN: "${PDG_PUBLIC_DOMAIN:-}"
      PDG_PROXY_MAX_BODY_SIZE: "${PDG_PROXY_MAX_BODY_SIZE:-27MB}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    pids_limit: 128
    cpus: "1.0"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  caddy_data:
  caddy_config:

secrets:
  mcp_auth_token:
    file: ${PDG_MCP_AUTH_TOKEN_HOST_FILE:-./secrets/mcp_auth_token}
