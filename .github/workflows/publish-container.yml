name: Publish multi-architecture container

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing reviewed SemVer tag, for example v0.1.0
        required: true
        type: string
      confirm_publish:
        description: Type PUBLISH to authorize a public GHCR push
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: inputs.confirm_publish == 'PUBLISH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify tag matches application version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(python -c 'from app import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$VERSION"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
          flavor: latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CORPUSGATE_VERSION=${{ steps.meta.outputs.version }}
            CORPUSGATE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
