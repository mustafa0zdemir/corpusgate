name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[semantic,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing
      - run: python scripts/verify_release_contract.py
      - name: Validate Compose and critical setup syntax
        env:
          CORPUSGATE_API_KEY: ci-rest-key-0123456789abcdef
          CORPUSGATE_MCP_AUTH_TOKENS: ci-mcp-key-0123456789abcdef
        run: |
          sh -n corpusgate scripts/setup.sh scripts/upload.sh
          mkdir -p documents
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.semantic.yaml config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime image
        run: docker build --target runtime --tag corpusgate:ci .
      - name: Verify non-root metadata and CLI
        run: |
          test "$(docker image inspect corpusgate:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm corpusgate:ci corpusgate-admin version
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: corpusgate:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

  multiarch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=cacheonly

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
